name: Build and push

# Keeps the wordpress-ldap image (wordpress + the PHP ldap extension)
# current with upstream WordPress/PHP security fixes without anyone having
# to remember to rebuild it.
#
# Runs on a schedule and always builds with --pull: if the upstream base
# hasn't changed, the resulting image is bit-for-bit identical and the push
# is a no-op (same digest, no new layers stored). No separate "did the base
# change" check is needed -- GHCR/Docker already dedupe on digest.

on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [Dockerfile]

permissions:
  contents: read
  packages: write

env:
  # Bump this one line to move both variants to a new PHP version.
  PHP_VERSION: "8.4"

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: fpm-alpine
            runtime_user: root
            tag: fpm-alpine
          - flavor: cli
            runtime_user: www-data
            tag: cli
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the base image for this flavour
        id: vars
        run: |
          if [ "${{ matrix.flavor }}" = "cli" ]; then
            echo "base=wordpress:cli-php${PHP_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "base=wordpress:php${PHP_VERSION}-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          build-args: |
            BASE=${{ steps.vars.outputs.base }}
            RUNTIME_USER=${{ matrix.runtime_user }}
          tags: ghcr.io/${{ github.repository_owner }}/wordpress-ldap-public:${{ matrix.tag }}
